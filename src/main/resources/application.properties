# Environment Configuration
spring.config.import=optional:file:.env[.properties]

# New Files Using With Env File To secure our Program 

server.port=${PORT:5000}
server.address=0.0.0.0

# Load .env automatically (optional = app still starts if the file is missing)


# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true



# JWT Security Configuration


# Mail
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_MAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Security & JWT
neuromart.jwt.secret=${JWT_SECRET_KEY}
neuromart.jwt.expire-hours=${JWT_EXPIRE_HOURS}
neuromart.jwt.issuer=${JWT_ISSUER}
neuromart.jwt.audience=${JWT_AUDIENCE}
neuromart.jwt.cookie-expire-days=7
neuromart.reset-password-expire-minutes=30
neuromart.client.url=${CLIENT_URL:http://localhost:5173}



# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB



# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_API_KEY}
razorpay.key-secret=${RAZORPAY_API_SECRET}